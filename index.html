<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8f1" />
    <meta name="color-scheme" content="light" />
    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <title>情緒導航員</title>
    <style>
:root {
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'Trebuchet MS', sans-serif;
  color: #173a35;
  background: #f4f8f1;
  color-scheme: light;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --ink: #173a35;
  --muted: #59736c;
  --green: #176e5c;
  --green-dark: #105648;
  --mint: #dcefe3;
  --coral: #db6e55;
  --yellow: #efc65c;
  --line: #d7e4d9;
  --paper: #fffefa;
  --shadow: 0 16px 48px rgb(31 76 60 / 9%);
}

* { box-sizing: border-box; }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background:
    radial-gradient(ellipse at 12% 10%, rgb(220 239 227 / 76%), transparent 33rem),
    linear-gradient(135deg, #f4f8f1 0%, #f8f6e9 54%, #edf5ef 100%);
}

button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible + label {
  outline: 3px solid #df9b38;
  outline-offset: 3px;
}

.topbar {
  position: sticky;
  z-index: 20;
  top: env(safe-area-inset-top, 0px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 72px;
  padding: 0 clamp(20px, 6vw, 88px);
  border-bottom: 1px solid rgb(23 58 53 / 9%);
  background: rgb(248 250 244 / 96%);
  backdrop-filter: blur(10px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-family: Georgia, 'Noto Sans TC', serif;
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  width: 30px;
  aspect-ratio: 1;
  place-items: center;
  border-radius: 50%;
  background: var(--green);
  color: white;
  font-size: 16px;
}

.help-button, .button, .choice-card, .emotion-choice, .strength-choice {
  cursor: pointer;
}

.help-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 15px;
  border: 1px solid #c4d9cc;
  border-radius: 6px;
  background: rgb(255 254 250 / 75%);
  color: var(--green-dark);
  font-size: 14px;
  font-weight: 700;
}

.help-button span { color: var(--coral); font-size: 18px; }
.help-button:hover { background: white; border-color: var(--green); }
.top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; }
.header-button { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 5px; background: #fffefa; color: var(--green-dark); cursor: pointer; font-size: 12px; font-weight: 800; }
.header-button:hover { border-color: var(--green); }
.session-timer { display: flex; min-width: 120px; align-items: center; justify-content: center; gap: 9px; padding: 7px 12px; border: 2px solid #cf9b37; border-radius: 6px; background: #fff5d7; color: #583f0f; }
.session-timer strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.timer-label { font-size: 11px; font-weight: 800; }
.session-timer.urgent { border-color: #bd4d3f; background: #fff0e9; color: #8c332b; animation: timer-pulse 1.4s ease-in-out infinite; }
@keyframes timer-pulse { 50% { box-shadow: 0 0 0 4px rgb(189 77 63 / 13%); } }
[hidden] { display: none !important; }

.app-shell {
  width: min(1100px, calc(100% - 40px));
  margin: 0 auto;
  padding: clamp(34px, 6vw, 72px) 0 30px;
}

.intro { max-width: 700px; margin: 0 auto 38px; text-align: center; }
.eyebrow {
  margin: 0 0 10px;
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

h1, h2, h3, p { overflow-wrap: anywhere; }
h1 {
  margin: 0;
  color: var(--ink);
  font-family: Georgia, 'Noto Sans TC', serif;
  font-size: clamp(30px, 5vw, 48px);
  font-weight: 700;
  line-height: 1.24;
}

.intro-copy { margin: 15px 0 0; color: var(--muted); font-size: 15px; line-height: 1.8; }

.work-area {
  max-width: 820px;
  margin: 0 auto;
  padding: clamp(22px, 4vw, 38px);
  border: 1px solid rgb(23 58 53 / 10%);
  border-radius: 10px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.journey-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
.journey-head .eyebrow { margin-bottom: 7px; }
.journey-head h2 { margin: 0; font-size: clamp(20px, 3vw, 26px); line-height: 1.4; }
.step-count { flex: 0 0 auto; color: #789087; font-size: 12px; font-weight: 700; }

.progress-track { height: 5px; margin: 22px 0 26px; overflow: hidden; border-radius: 5px; background: #e8eee7; }
.progress-track span { display: block; width: 25%; height: 100%; border-radius: inherit; background: var(--green); transition: width 220ms ease; }
.screen { min-height: 290px; animation: arrive 260ms ease both; }

@keyframes arrive {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}

.choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.choice-card {
  display: grid;
  grid-template-columns: 58px 1fr;
  align-items: center;
  gap: 14px;
  min-height: 112px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  text-align: left;
  transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
}
.choice-card:hover { transform: translateY(-2px); border-color: #79ac92; background: #fbfefa; }
.choice-emoji { display: grid; width: 54px; aspect-ratio: 1; place-items: center; border-radius: 5px; background: #f0f5e9; font-size: 30px; }
.choice-card[data-state="angry"] .choice-emoji { background: #fff0e9; }
.choice-card[data-state="happy"] .choice-emoji { background: #fff6d9; }
.choice-card[data-state="sad"] .choice-emoji { background: #eaf3f5; }
.choice-card[data-state="calm"] .choice-emoji { background: #e5f2e7; }
.choice-card strong, .emotion-choice strong { display: block; margin-bottom: 4px; font-size: 16px; }
.choice-card small, .emotion-choice small { display: block; color: var(--muted); font-size: 13px; line-height: 1.55; }

.emotion-list, .strength-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.emotion-choice, .strength-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 78px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
  text-align: left;
}
.emotion-choice:hover, .strength-choice:hover { border-color: #79ac92; background: #fbfefa; }
.emotion-choice[aria-pressed="true"], .strength-choice[aria-pressed="true"] { border: 2px solid var(--green); background: #eef7ef; }
.emotion-icon, .strength-icon { display: grid; flex: 0 0 38px; width: 38px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: #eff5ec; font-size: 21px; }
.emotion-choice > span:last-child, .strength-choice > span:last-child { min-width: 0; }
.strength-choice.selected { border: 2px solid var(--green); background: #eef7ef; }
.selection-note { margin: 13px 0 0; color: var(--muted); font-size: 13px; }

.range-panel { padding: 22px; border-radius: 7px; background: #f4f7ef; }
.range-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.range-top strong { font-size: 17px; }
.range-value { display: grid; min-width: 42px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: var(--green); color: white; font-weight: 800; }
.range-panel input[type="range"] { width: 100%; margin: 25px 0 8px; accent-color: var(--green); cursor: pointer; }
.range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
.range-hint { margin: 16px 0 0; color: var(--ink); font-size: 14px; line-height: 1.7; }

.profile-form { display: grid; max-width: 510px; gap: 14px; margin: 0 auto; }
.profile-form > label { display: grid; gap: 7px; color: var(--ink); font-size: 14px; font-weight: 800; }
.profile-form input, .profile-form select { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid #b9cec0; border-radius: 5px; background: white; color: var(--ink); font-size: 17px; }
.profile-privacy { margin: 1px 0 0; padding: 12px 14px; border-left: 3px solid #d5a947; background: #fbf6e7; color: #5c5136; font-size: 12px; line-height: 1.7; }
.profile-error { min-height: 18px; margin: 0; color: #a53f34; font-size: 13px; }
.profile-data-control { padding-top: 5px; border-top: 1px solid #e5ebe4; text-align: right; }
.profile-data-control .button { min-height: 38px; font-size: 12px; }
.start-panel { min-height: 260px; display: grid; align-content: center; }

.feedback-note { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.75; }
.activity-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.activity-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: white; }
.activity-card > img { display: block; width: 100%; height: auto; aspect-ratio: 13 / 8; object-fit: cover; background: #edf3e9; }
.activity-card-copy { padding: 15px; }
.activity-card-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--green); font-size: 11px; font-weight: 800; }
.activity-card h3, .guide-copy h3, .activity-check h3 { margin: 8px 0 5px; font-size: 17px; }
.activity-card p, .guide-copy > p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
.activity-pick { width: 100%; min-height: 40px; margin-top: 13px; font-size: 13px; }
.activity-card.locked { border-color: #e3c9c3; background: #fbf7f5; }
.activity-card.locked > img { filter: saturate(.55); }
.activity-card.locked .activity-card-meta { color: #a04f43; }
.locked-note { display: block; margin-top: 12px; color: #91483e; font-size: 12px; font-weight: 700; line-height: 1.5; }
.safety-banner { margin-bottom: 16px; padding: 15px 17px; border-left: 4px solid #c75e4e; border-radius: 4px; background: #fff0e9; color: #713e34; font-size: 14px; line-height: 1.75; }
.guide-layout { display: grid; grid-template-columns: minmax(190px, .9fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.guide-image { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 7px; }
.guide-copy { min-width: 0; }
.guide-copy h3 { margin-top: 9px; font-size: 21px; }
.guide-steps { display: grid; gap: 10px; margin: 16px 0; padding: 0; list-style: none; counter-reset: step; }
.guide-steps li { counter-increment: step; }
.guide-steps label { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: #fbfcf8; font-size: 14px; line-height: 1.65; }
.guide-steps label::before { display: grid; flex: 0 0 25px; width: 25px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: var(--mint); color: var(--green-dark); content: counter(step); font-size: 12px; font-weight: 800; }
.guide-steps input { flex: 0 0 18px; width: 18px; height: 18px; margin: 4px 0 0; accent-color: var(--green); }
.drawing-panel, .wheel-panel { display: grid; gap: 9px; margin-top: 15px; }
#doodle-canvas { display: block; width: 100%; height: 150px; border: 1px solid #cbdccf; border-radius: 5px; background: #fffefa; touch-action: none; }
.wheel-panel { grid-template-columns: 92px minmax(0, 1fr); align-items: center; }
.wheel-control { display: grid; min-height: 90px; place-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 6px; background: #f2f6ec; color: var(--green-dark); cursor: pointer; font-size: 12px; font-weight: 800; }
.wheel-art { display: grid; width: 52px; aspect-ratio: 1; place-items: center; border: 5px solid var(--green); border-radius: 50%; font-size: 34px; transition: transform 300ms ease; }
.wheel-control.turned .wheel-art { transform: rotate(180deg); }
.reframe-list { display: grid; gap: 6px; }
.reframe-choice { padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--ink); cursor: pointer; font-size: 12px; line-height: 1.5; text-align: left; }
.reframe-choice.selected { border: 2px solid var(--green); background: #eef7ef; }
.reframe-choice:disabled { cursor: not-allowed; opacity: .5; }
.verification-note { margin: 12px 0 0; color: #6b6251; font-size: 12px; line-height: 1.6; }
.guide-instruction { margin: 12px 0; padding: 11px 13px; border-left: 3px solid #d6ad48; border-radius: 3px; background: #fbf6e7; color: #5b4b26; }
.check-label { display: block; margin-top: 5px; color: var(--green); font-size: 11px; font-weight: 800; }
.adult-confirm { display: flex; align-items: flex-start; gap: 12px; margin: 15px 0; padding: 15px; border: 1px solid #c9dace; border-radius: 6px; background: #f1f7ee; color: var(--ink); cursor: pointer; font-size: 15px; font-weight: 800; line-height: 1.6; }
.adult-confirm input { flex: 0 0 23px; width: 23px; height: 23px; margin: 1px 0 0; accent-color: var(--green); }
.activity-timer-panel { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 10px; margin: 14px 0; padding: 14px; border: 1px solid #bfd7ca; border-radius: 7px; background: #edf7ef; }
.activity-timer-copy { display: grid; gap: 4px; }
.activity-timer-copy strong { color: var(--green-dark); font-size: 16px; }
.activity-timer-copy span, .activity-timer-panel > p { color: var(--muted); font-size: 12px; }
.activity-timer-value { min-width: 52px; color: var(--ink); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
.activity-timer-panel > p { grid-column: 1 / -1; margin: 0; line-height: 1.6; }
.timer-big-number { display: grid; min-width: 46px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: var(--green); color: white; font-size: 27px; font-weight: 900; }
.timer-finished { color: var(--green-dark); font-weight: 900; }
.interaction-instruction { margin: 13px 0 9px; color: var(--green-dark); font-size: 13px; font-weight: 700; line-height: 1.6; }
.roulette-panel { display: grid; justify-items: center; gap: 9px; margin: 14px 0; padding: 15px; border: 1px solid var(--line); border-radius: 7px; background: #f7f7ed; }
.roulette-pointer { z-index: 1; margin-bottom: -17px; color: #b94f41; font-size: 27px; }
.roulette-wheel { position: relative; width: min(220px, 58vw); aspect-ratio: 1; border: 5px solid #fffefa; border-radius: 50%; background: conic-gradient(#f5d877 -60deg 60deg, #b9dbc3 60deg 180deg, #edaa8a 180deg 300deg, #f5d877 300deg 360deg); box-shadow: 0 3px 13px rgb(23 58 53 / 18%); cursor: pointer; transition: transform 1.5s cubic-bezier(.11,.72,.17,1); }
.roulette-wheel.spinning { filter: saturate(1.2); }
.roulette-label { position: absolute; width: 90px; color: #173a35; font-size: 11px; font-weight: 900; line-height: 1.35; text-align: center; }
.label-a { top: 23px; left: calc(50% - 45px); }
.label-b { right: 7px; bottom: 35px; transform: rotate(120deg); }
.label-c { bottom: 35px; left: 7px; transform: rotate(-120deg); }
.roulette-result { min-height: 20px; margin: 0; color: var(--green-dark); font-size: 13px; font-weight: 900; }
.sticker-groups { display: grid; gap: 16px; }
.sticker-group h3 { margin: 0 0 8px; font-size: 16px; }
.sticker-shelf { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.sticker-tile { display: grid; min-height: 116px; align-content: center; justify-items: center; gap: 5px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; text-align: center; }
.sticker-tile.earned { background: #f5f6e6; border-color: #d9c675; }
.sticker-tile.unearned { background: #f3f5f1; color: #839189; }
.sticker-tile > span { font-size: 26px; }
.sticker-tile strong { font-size: 11px; line-height: 1.4; }
.sticker-tile small { font-size: 10px; line-height: 1.4; }
.activity-check { max-width: 560px; margin: 0 auto; padding: 10px 0; text-align: center; }
.activity-check img { width: 130px; height: 80px; border-radius: 6px; object-fit: cover; }
.activity-check h3 { font-size: 23px; }
.activity-check > p:not(.verification-note) { color: var(--muted); line-height: 1.75; }
.check-buttons { justify-content: center; }
.report-summary { font-size: 13px; }
.report-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.report-table th, .report-table td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }

.button-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
.button-row.end { justify-content: flex-end; }
.button {
  min-height: 46px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 800;
}
.button-primary { background: var(--green); color: white; }
.button-primary:hover { background: var(--green-dark); }
.button-secondary { border-color: var(--line); background: white; color: var(--ink); }
.button-secondary:hover { border-color: #79ac92; }
.button-link { border: 0; background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.button:disabled { cursor: not-allowed; opacity: .45; }

.done-panel { padding: 22px 10px; text-align: center; }
.done-mark { display: grid; width: 64px; aspect-ratio: 1; margin: 0 auto 14px; place-items: center; border-radius: 50%; background: #e6f2e6; color: var(--green); font-size: 30px; }
.done-panel h3 { margin: 0; font-family: Georgia, 'Noto Sans TC', serif; font-size: 25px; }
.done-panel p { max-width: 460px; margin: 10px auto 0; color: var(--muted); line-height: 1.8; }
.strength-summary { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
.strength-summary span { padding: 7px 10px; border-radius: 4px; background: #f3f6e9; color: #375b4d; font-size: 13px; }

.page-note { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 24px auto 0; color: #627a70; font-size: 13px; line-height: 1.7; text-align: center; }
.note-star { color: var(--coral); font-size: 17px; }

.help-dialog { width: min(430px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); box-shadow: 0 22px 80px rgb(16 40 31 / 24%); }
.help-dialog::backdrop { background: rgb(20 42 35 / 42%); }
.help-dialog form { position: relative; padding: 32px; }
.help-dialog h2 { margin: 0; font-family: Georgia, 'Noto Sans TC', serif; font-size: 27px; }
.help-dialog p:not(.eyebrow) { color: var(--muted); line-height: 1.8; }
.dialog-close { position: absolute; top: 13px; right: 16px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 27px; }
.dialog-done { margin-top: 8px; }
.call-progress, .call-success { display: grid; justify-items: center; gap: 11px; padding: 18px 0; text-align: center; }
.call-progress small { color: var(--muted); }
.call-spinner { width: 42px; aspect-ratio: 1; border: 4px solid #dce9dd; border-top-color: var(--green); border-radius: 50%; animation: spin 850ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.call-success > span { display: grid; width: 50px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: #e3f1e4; color: var(--green); font-size: 27px; font-weight: 900; }
.call-success strong { font-size: 18px; }
.call-success p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

@media (max-width: 620px) {
  .topbar { display: grid; grid-template-columns: 1fr; gap: 7px; min-height: 0; padding: 9px 12px; }
  .brand { font-size: 15px; }
  .help-button { min-height: 40px; padding: 0 9px; font-size: 11px; white-space: nowrap; }
  .top-actions { width: 100%; justify-content: space-between; gap: 5px; }
  .header-button { min-height: 40px; padding: 0 8px; font-size: 10px; white-space: nowrap; }
  .session-timer { min-width: 92px; gap: 5px; padding: 6px 8px; }
  .session-timer strong { font-size: 17px; }
  .timer-label { font-size: 9px; }
  #profile-button { max-width: 58px; padding: 0 8px; }
  .app-shell { width: min(100% - 24px, 520px); padding-top: 35px; }
  .intro { margin-bottom: 26px; }
  .intro-copy { font-size: 14px; }
  .work-area { padding: 20px 16px; }
  .screen { min-height: 330px; }
  .choice-grid, .emotion-list, .strength-list { grid-template-columns: 1fr; }
  .activity-grid { grid-template-columns: 1fr; }
  .choice-card { min-height: 88px; }
  .journey-head { align-items: center; }
  .step-count { font-size: 11px; }
  .button-row { align-items: stretch; }
  .button-row .button { padding: 0 12px; }
  .page-note { align-items: flex-start; text-align: left; }
  .guide-layout { grid-template-columns: 1fr; }
  .guide-image { max-height: 220px; object-fit: cover; }
  .activity-card > img { max-height: 220px; object-fit: cover; }
  .wheel-panel { grid-template-columns: 1fr; }
  .wheel-control { min-height: 74px; }

/* 瀏覽器儲存：全部包 try/catch，讀不到時退回記憶體 */
const memStore = {};
function storeGet(kind, key) {
  try { return window[kind].getItem(key); } catch { return memStore[kind + key] ?? null; }
}
function storeSet(kind, key, value) {
  try { window[kind].setItem(key, value); } catch { memStore[kind + key] = value; }
}
function storeRemove(kind, key) {
  try { window[kind].removeItem(key); } catch { delete memStore[kind + key]; }
}

/* ---------- 後端連線（Google Apps Script） ----------
   網址寫在 config.js。後端沒設定或連不上時，學生端仍可使用，只是資料只存在這台裝置。 */
const API_URL = (window.APP_CONFIG && window.APP_CONFIG.API_URL) || '';
const apiEnabled = () => /^https:\/\/script\.google\.com\//.test(API_URL);

async function api(action, payload = {}, timeoutMs = 8000) {
  if (!apiEnabled()) return null;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    /* 用純文字送出，瀏覽器不會先發 preflight 請求，Apps Script 才收得到 */
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }), signal: ctrl.signal });
    return await res.json();
  } catch { return null; } finally { clearTimeout(timer); }
}

/* 把雲端的使用時間、勳章、方法紀錄合併回這台裝置 */
async function syncProfile(profile) {
  if (!profile) return false;
  const res = await api('getStudent', { id: profile.id });
  if (!res || !res.ok) return false;
  const byAt = new Map([...(res.records || []), ...(profile.records || [])].map((r) => [r.at, r]));
  profile.records = [...byAt.values()].sort((a, b) => a.at - b.at);
  profile.starts = [...new Set([...(res.starts || []), ...(profile.starts || [])])].sort((a, b) => a - b);
  const badges = { ...(res.badges || {}) };
  Object.keys(profile.badges || {}).forEach((k) => { badges[k] = Math.max(badges[k] || 0, profile.badges[k]); });
  profile.badges = badges;
  return true;
}

/* 只有後端確定寄出通知信，才回傳 true（畫面才會顯示「已通知老師」） */
async function sendHelp(entry) {
  const p = session.profile;
  const res = await api('help', { id: p ? p.id : '', who: entry.who, emotion: entry.emotion, rating: entry.rating }, 12000);
  return Boolean(res && res.ok && res.emailed);
}

/* 紀錄先放進待送清單，網路不穩時下次再補送，不會遺失 */
const OUTBOX_KEY = 'emotion-navigator-outbox-v1';
function outboxRead() { try { return JSON.parse(storeGet('localStorage', OUTBOX_KEY) || '[]'); } catch { return []; } }
function outboxWrite(list) { storeSet('localStorage', OUTBOX_KEY, JSON.stringify(list)); }
let flushing = false;
async function flushOutbox() {
  if (flushing || !apiEnabled()) return;
  flushing = true;
  try {
    const rest = [];
    for (const item of outboxRead()) {
      const res = await api('saveRecord', item, 10000);
      if (!res || !(res.ok || res.error === 'bad_record' || res.error === 'bad_id')) rest.push(item);
    }
    outboxWrite(rest);
  } finally { flushing = false; }
}

/* ---------- 教師端：登入由後端驗證，資料用輪詢更新 ---------- */
const teacherData = { records: [], help: [], remote: false, sig: '' };
let teacherPoll = null;
function unwatchTeacherData() {
  if (teacherPoll) window.clearInterval(teacherPoll);
  teacherPoll = null;
  if (teacherUI.token) api('teacherLogout', { token: teacherUI.token });
  teacherUI.token = null;
  teacherData.records = []; teacherData.help = []; teacherData.remote = false; teacherData.sig = '';
}
async function loadTeacherData() {
  const res = await api('teacherData', { token: teacherUI.token }, 15000);
  if (!res) return;
  if (res.error === 'unauthorized') {
    unwatchTeacherData();
    setStage('teacherGate');
    const err = document.querySelector('#teacher-error');
    if (err) err.textContent = '登入已逾時，請重新登入。';
    return;
  }
  if (!res.ok) return;
  const sig = JSON.stringify([res.records, res.help]);
  if (sig === teacherData.sig) return;
  teacherData.sig = sig;
  teacherData.records = res.records || [];
  teacherData.help = res.help || [];
  teacherData.remote = true;
  if (session.stage === 'teacherDashboard') render();
}
async function watchTeacherData() {
  if (teacherPoll) window.clearInterval(teacherPoll);
  await loadTeacherData();
  teacherPoll = window.setInterval(loadTeacherData, 20000);
}
async function teacherLogin(account, password) {
  const err = document.querySelector('#teacher-error');
  if (!apiEnabled()) { err.textContent = '尚未設定後端網址（請編輯 config.js）。'; return; }
  err.textContent = '登入中…';
  const res = await api('teacherLogin', { account, password }, 12000);
  if (!res) { err.textContent = '連不上伺服器，請確認網路與後端設定。'; return; }
  if (!res.ok) { err.textContent = res.message || '帳號或密碼錯誤。'; return; }
  teacherUI.token = res.token;
  teacherUI.view = 'students';
  session.expired = false;
  await watchTeacherData();
  setStage('teacherDashboard');
}

function updateHighIntensityClock() {
  const timer = document.querySelector('#session-timer');
  const clock = document.querySelector('#session-clock');
  const showTimer = session.sessionStartedAt !== null && session.stage !== 'profile' && session.stage !== 'start';
  timer.hidden = !showTimer;
  if (!showTimer) return;
  const remaining = Math.max(0, SESSION_LIMIT_MS - (Date.now() - session.sessionStartedAt));
  const seconds = Math.ceil(remaining / 1000);
  clock.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  timer.classList.toggle('urgent', remaining <= 60 * 1000);
}

function recordNegativeRating(value) {
  if (states[session.state].route !== 'negative') return false;
  if (value === 5) {
    session.consecutiveFiveRatings += 1;
    if (session.consecutiveFiveRatings >= 2) {
      stopSelfGuidance('two-fives');
      return true;

    return false;

  session.consecutiveFiveRatings = 0;

}

function profileTimerKey(profile) {

function stopSessionTimer(clearStored = false) {
  if (session.sessionTimerId !== null) window.clearInterval(session.sessionTimerId);
  session.sessionTimerId = null;
  if (clearStored && session.profile) storeRemove('sessionStorage', profileTimerKey(session.profile));
  session.sessionStartedAt = null;
  updateHighIntensityClock();
}

function startSessionTimer() {
  if (isTester()) { session.sessionStartedAt = null; updateHighIntensityClock(); return; }
  const stored = Number(storeGet('sessionStorage', profileTimerKey(session.profile)));
  session.sessionStartedAt = stored || Date.now();
  storeSet('sessionStorage', profileTimerKey(session.profile), String(session.sessionStartedAt));
  if (Date.now() - session.sessionStartedAt >= SESSION_LIMIT_MS) {
    session.expired = true;
    session.stage = 'sessionStop';
    render();
    return;
  }
  if (session.sessionTimerId !== null) window.clearInterval(session.sessionTimerId);
  session.sessionTimerId = window.setInterval(() => {
    updateHighIntensityClock();
    if (TEACHER_STAGES.includes(session.stage)) return;
    if (Date.now() - session.sessionStartedAt >= SESSION_LIMIT_MS) stopSelfGuidance('session-time');
  }, 250);

function guideComplete() {
  const item = activities.find((activity) => activity.id === session.selectedActivity);
  const allStepsChecked = session.checkedSteps.length === item.steps.length;
  if (item.interaction === 'drawing') return allStepsChecked && session.interactionDone.drawing;
  if (item.interaction === 'wheel') return Boolean(session.interactionDone.wheel && session.interactionDone.reframe);
  if (item.breathing || item.timedActivity) return allStepsChecked && session.activityTimer?.phase === 'complete';
  return allStepsChecked && (!item.waitSeconds || Boolean(session.waitDone));
}

function activityTimerMarkup(item) {
  if (!item.breathing && !item.timedActivity) return '';
  const timer = session.activityTimer || { phase: 'ready', cycle: 0, seconds: 0, phaseLabel: '' };
  const checked = session.checkedSteps.length === item.steps.length;
  let message = checked ? '準備好後，按下開始；畫面會先倒數 3 秒。' : '先做完上面的步驟並打勾，開始按鈕才會亮起。';
  let button = `<button class="button button-primary" data-action="start-activity-timer" ${checked ? '' : 'disabled'}>開始前倒數</button>`;
  if (timer.phase === 'countdown') {
    message = '準備開始';
    button = `<span class="timer-big-number">${timer.seconds}</span>`;
  } else if (timer.phase === 'active') {
    message = timer.phaseLabel;
    button = `<button class="button button-secondary" data-action="stop-activity-timer">停止</button>`;
  } else if (timer.phase === 'complete') {
    message = '這個計時活動完成了。可以休息一下，再按下方按鈕。';
    button = '<span class="timer-finished">✓ 完成</span>';
  }
  const cycle = item.breathing ? `第 ${Math.min(timer.cycle + 1, item.breathing.cycles)} / ${item.breathing.cycles} 組` : item.timedActivity.label;
  return `<div class="activity-timer-panel" id="activity-timer-panel" aria-live="polite">
    <div class="activity-timer-copy"><strong>${message}</strong><span>${cycle}</span></div>
    <span class="activity-timer-value">${timer.phase === 'active' ? `${timer.seconds} 秒` : timer.phase === 'countdown' ? timer.seconds : '準備'}</span>${button}
    <p>跟著畫面做就好；若頭暈或不舒服，請停止動作。</p>
  </div>`;
}

function updateActivityTimerPanel() {
  const item = activities.find((activity) => activity.id === session.selectedActivity);
  const panel = app.querySelector('#activity-timer-panel');
  if (!panel || !item) return;
  const holder = document.createElement('div');
  holder.innerHTML = activityTimerMarkup(item);
  panel.replaceWith(holder.firstElementChild);
  const ready = app.querySelector('[data-action="activity-ready"]');
  if (ready) ready.disabled = !guideComplete();
}

function stopActivityTimer() {
  if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
  session.activityTimerId = null;
  session.activityTimer = { phase: 'ready', cycle: 0, seconds: 0, phaseLabel: '' };
  updateActivityTimerPanel();
}

function startActivityTimer() {
  const item = activities.find((activity) => activity.id === session.selectedActivity);
  session.activityTimer = { phase: 'countdown', cycle: 0, seconds: 3, phaseLabel: '' };
  updateActivityTimerPanel();
  session.activityTimerId = window.setInterval(() => {
    const timer = session.activityTimer;
    if (timer.phase === 'countdown') {
      timer.seconds -= 1;
      if (timer.seconds <= 0) {
        timer.phase = 'active';
        timer.cycle = 0;
        timer.phaseIndex = 0;
        timer.seconds = item.breathing ? item.breathing.phases[0][1] : item.timedActivity.seconds;
        timer.phaseLabel = item.breathing ? item.breathing.phases[0][0] : item.timedActivity.label;
      }
    } else if (timer.phase === 'active') {
      timer.seconds -= 1;
      if (timer.seconds <= 0) {
        if (!item.breathing || timer.phaseIndex + 1 < item.breathing.phases.length) {
          if (item.breathing) {
            timer.phaseIndex += 1;
            const [label, seconds] = item.breathing.phases[timer.phaseIndex];
            timer.phaseLabel = label;
            timer.seconds = seconds;
          } else {
            timer.phase = 'complete';
          }
        } else {
          timer.cycle += 1;
          if (timer.cycle >= item.breathing.cycles) timer.phase = 'complete';
          else {
            timer.phaseIndex = 0;
            const [label, seconds] = item.breathing.phases[0];
            timer.phaseLabel = label;
            timer.seconds = seconds;
          }
        }
      }
    }
    if (timer.phase === 'complete') {
      window.clearInterval(session.activityTimerId);
      session.activityTimerId = null;
    }
    updateActivityTimerPanel();
  }, 1000);
}

function setupDrawingCanvas() {
  const canvas = app.querySelector('#doodle-canvas');
  const context = canvas.getContext('2d');
  context.lineWidth = 7;
  context.lineCap = 'round';
  context.strokeStyle = '#181818';
  let drawing = false;
  const point = (event) => {
    const bounds = canvas.getBoundingClientRect();
    return { x: (event.clientX - bounds.left) * (canvas.width / bounds.width), y: (event.clientY - bounds.top) * (canvas.height / bounds.height) };
  };
  canvas.addEventListener('pointerdown', (event) => {
    drawing = true;
    canvas.setPointerCapture(event.pointerId);
    const position = point(event);
    context.beginPath();
    context.arc(position.x, position.y, 4, 0, Math.PI * 2);
    context.fill();
    context.beginPath();
    context.moveTo(position.x, position.y);
    startDrawClock();
  });
  canvas.addEventListener('pointermove', (event) => {
    if (!drawing) return;
    const position = point(event);
    context.lineTo(position.x, position.y);
    context.stroke();
    startDrawClock();
  });
  canvas.addEventListener('pointerup', () => { drawing = false; });
  canvas.addEventListener('pointercancel', () => { drawing = false; });
}

function availableActivities() {
  const level = session.highIntensityCycle ? session.highLevelStep : session.activityLevelOverride ?? (session.rating <= 2 ? 1 : 2);
  return activities.filter((item) => {
    if (session.triedActivities.includes(item.id)) return false;
    if (session.highIntensityCycle && !session.adultPresent) return false;
    return item.level === level;
  });
}

function recommendAnotherActivity() {
  const alternatives = availableActivities().filter((item) => item.id !== session.recommendedActivityId);
  if (!alternatives.length) return false;
  session.recommendedActivityId = alternatives[Math.floor(Math.random() * alternatives.length)].id;
  render();
  return true;
}

function renderActivityList() {
  const level = session.highIntensityCycle ? session.highLevelStep : session.activityLevelOverride ?? (session.rating <= 2 ? 1 : 2);
  const available = availableActivities();
  if (!available.some((item) => item.id === session.recommendedActivityId)) {
    session.recommendedActivityId = available.length ? available[Math.floor(Math.random() * available.length)].id : null;
  }
  const item = available.find((activity) => activity.id === session.recommendedActivityId);
  const latestRise = session.rating > session.preActivityRating;
  const retrySameLevel = session.retrySameLevel;
  const highNotice = session.highIntensityCycle
    ? `<div class="safety-banner"><strong>第 ${level} 級方法（共 3 級）。</strong>請由大人陪同；不舒服就停止或找大人。完成這一級後再進入下一級，頂端整趟倒數不會重設。</div>` : '';
  const message = latestRise
    ? '<p class="feedback-note">感覺比剛才更強了。先停一停，換一種沒試過的方法；如果不想繼續，請找大人陪你。</p>'
    : retrySameLevel
      ? `<p class="feedback-note">剛才的方法沒有讓「${session.emotion}」的分數下降。這次先試一張同級、不同的方法。</p>`
      : `<p class="feedback-note">導航員先抽出一張第 ${level} 級方法。一次只試一種，完成後再回來評估。</p>`;
  if (!item) {
    const exhaustedContent = session.highIntensityCycle
      ? `<h3>這一級沒有其他可用方法</h3><p>請找老師或信任的大人陪你決定下一步，不要獨自繼續。</p><div class="button-row end"><button class="button button-primary" data-action="help">請老師來</button></div>`
      : `<h3>這一級的方法都試過了</h3><p>先重新評估「${session.emotion}」的強度，再決定要不要找大人幫忙；也可以結束這一趟。</p><div class="button-row"><button class="button button-secondary" data-action="help">請老師來</button><button class="button button-secondary" data-action="review-after-exhaustion">再測一次感受</button><button class="button button-primary" data-action="finish-without-activity">結束這一趟</button></div>`;
    return `${highNotice}<div class="done-panel"><span class="done-mark">♡</span>${exhaustedContent}</div>`;
  }
  return `<div class="activity-grid" role="group" aria-label="本次隨機推薦的調節方式">
    <article class="activity-card">
      <img src="${assetSrc(item.image)}" alt="${item.alt}" width="260" height="160">

      <h3>${item.name}</h3><p>${item.summary}</p>
      <button class="button button-secondary activity-pick" data-action="choose-activity" data-value="${item.id}">開始導航</button></div>
    </article>
    </div>`;
}

      <div class="guide-two"><div class="demo-area"><p class="area-title">示範動畫</p><img src="${assetSrc(item.image)}" alt="${item.alt}" width="260" height="160"></div><div class="do-area"><p class="area-title">跟做區域</p>${doing}</div></div>
      ${timed ? '' : checks}
      <div class="button-row">${back}<button class="button button-primary" data-action="activity-ready" ${guideComplete() ? '' : 'disabled'}>下一步</button></div>`;
  },
  activityCheck() {
    const item = activities.find((activity) => activity.id === session.selectedActivity);
    return `<div class="activity-check"><img src="${assetSrc(item.image)}" alt="" width="130" height="80"><h3>${item.name}</h3><p>請依照你的實際情況回報。這不是考試，選「還沒做完」也完全可以。</p>
      <div class="button-row check-buttons"><button class="button button-secondary" data-action="report-not-done">我還沒做完</button><button class="button button-primary" data-action="report-done">我有跟著做</button></div>
      <p class="verification-note">這是學生自我回報；不錄影，也不收集身體動作。</p></div>`;
  },
  review() {
    return `<div class="range-panel"><div class="range-top"><strong>「${session.emotion}」這個感覺，現在有多強？</strong><output class="range-value" id="rating-output">${session.rating}</output></div>
      <input id="rating-range" type="range" min="1" max="5" step="1" value="${session.rating}" aria-label="活動後當下感受強度，1 到 5">
      <div class="range-labels"><span>一點點</span><span>非常強</span></div><p class="range-hint">數字變小、變大或一樣都可以。不需要為了完成而選某個數字。</p></div>
      <div class="button-row end"><button class="button button-primary" data-action="submit-review">繼續</button></div>`;
  },
  increased() {
    return `<div class="safety-banner"><strong>你回報「${session.emotion}」的感覺比剛才更強。</strong><br>不是你做錯了。先停一下，請告訴老師或信任的大人。</div>
      <label class="adult-confirm"><input type="checkbox" data-action="adult-confirm"><span>我已告訴老師／信任的大人，並確認下一步</span></label>
      <div class="button-row"><button class="button button-secondary" data-action="help">請老師來</button>${availableActivities().length ? '<button class="button button-primary" data-action="continue-with-adult" disabled>下一步，換一種方法</button>' : '<button class="button button-primary" data-action="finish-without-activity" disabled>下一步，先結束</button>'}</div>`;
  },
  adultGate() {
    return `<div class="safety-banner"><strong>你選了 5 級，先找大人陪你。</strong><br>接下來會依序做第 1、2、3 級方法，再一起回來重測。任何時候不舒服都可以停止。</div>
      <label class="adult-confirm"><input type="checkbox" data-action="adult-confirm"><span>老師／信任的大人已知道，並在我身邊陪同</span></label>
      <div class="button-row"><button class="button button-secondary" data-action="help">請老師來</button><button class="button button-primary" data-action="adult-present" disabled>下一步：選第 1 級方法</button></div>`;
  },
  supportStop() {
    const reason = session.stopReason === 'two-fives' ? '你已連續兩次選擇 5 級。' : '請先停止使用工具自己選方法。';
    return `<div class="safety-banner"><strong>${reason}</strong><br>請現在找身邊的老師或信任的大人陪你。這不是處罰，也不代表你做錯了。</div>
      <p class="feedback-note">你沒有做錯。接下來先由大人陪你決定，不再由工具推薦下一個方法。</p>
      <div class="button-row"><button class="button button-secondary" data-action="help">請老師來</button><button class="button button-primary" data-action="close-after-support">知道了</button></div>`;
  },
  sessionStop() {
    return `<div class="safety-banner"><strong>本次 5 分鐘使用時間已到。</strong><br>先停止操作，請找老師或信任的大人陪你。</div><div class="button-row end"><button class="button button-primary" data-action="logout">結束並登出</button></div>`;
  },
  done() {
    const group = strengthGroupByEmotion[session.emotion];
    const picked = group ? session.selectedStrengths.map((index) => strengths[group][index]?.[1]).filter(Boolean) : [];
    const effective = session.attempts.filter((a) => a.status === 'done' && typeof a.post === 'number' && a.post < a.pre);
    const report = session.attempts.length ? (effective.length ? `<p class="report-summary">點一點卡片，看看哪些方法幫到你：</p><div class="flip-row">${effective.map(flipCard).join('')}</div>` : '<p class="report-summary">這次還沒有讓感覺變小的方法，下次再試試別的。</p>') : '';
    const comparison = '';
    const again = !session.expired && session.stopReason !== 'two-fives' ? '<button class="button button-primary" data-action="restart">繼續體驗</button>' : '';
    const teacher = session.needsTeacher ? '<div class="safety-banner"><strong>請現在走到老師身邊，告訴老師你需要陪伴。</strong></div>' : '';
    return `${teacher}<div class="done-panel"><span class="done-mark" aria-hidden="true">✓</span><h3>這一趟完成了</h3><p>感覺不一定要馬上改變。謝謝你花時間照顧自己；想探索另一種情緒，可再開始一趟，沿用上方剩餘時間。</p>${comparison}${report}
      ${picked.length ? `<div class="strength-summary" aria-label="本次收集的優勢貼紙">${picked.map((name) => `<span>${name}</span>`).join('')}</div>` : ''}
      <div class="button-row end">${states[session.state]?.route === 'positive' ? '<button class="button button-secondary" data-action="stickers">查看我的貼紙</button>' : ''}${again}<button class="button button-secondary" data-action="logout">結束體驗</button></div></div>`;
  },
};

function levelForRating(r) { return r <= 2 ? 1 : r <= 4 ? 2 : 3; }

/* 同一級的方法都試過後，自動進下一級 */
function nextActivityLevel(level) {
  for (let l = level; l <= 3; l += 1) {
    if (activities.some((a) => a.level === l && !session.triedActivities.includes(a.id))) return l;
  }
  return null;
}

function usageGate() {
  const starts = session.profile.starts || [];
  const dayStart = new Date();
  dayStart.setHours(0, 0, 0, 0);
  if (starts.filter((t) => t >= dayStart.getTime()).length >= DAILY_LIMIT) return `今天已經使用 ${DAILY_LIMIT} 次囉，明天再來吧！`;
  const wait = MIN_GAP_MS - (Date.now() - Math.max(0, ...starts));
  if (wait > 0) return `距離上次使用還不到 40 分鐘，請再等 ${Math.ceil(wait / 60000)} 分鐘。`;
  return null;
}

async function tryBegin() {
  const profile = session.profile;
  if (!isTester()) await Promise.race([syncProfile(profile), new Promise((r) => setTimeout(r, 2500))]);
  let gate = null;
  if (!isTester()) {
    const res = await api('startSession', { id: profile.id });
    if (res && res.ok === false) gate = res.message || '現在不能使用，請稍後再試。';
    else if (!res) gate = usageGate(); /* 連不上後端時，退回這台裝置的判斷 */
  }
  const profiles = readProfiles();
  profiles[profile.id] = profile;
  saveProfiles(profiles);
  if (gate) { session.gateMessage = gate; render(); return; }
  session.gateMessage = null;
  profile.starts = [...(profile.starts || []), Date.now()];
  profiles[profile.id] = profile;
  saveProfiles(profiles);
  syncProfile(profile);
  storeRemove('sessionStorage', profileTimerKey(profile));
  beginSession();
}

function startDrawClock() {
  if (session.drawStart) return;
  session.drawStart = Date.now();
  const tick = () => {
    const left = Math.max(0, 60 - Math.floor((Date.now() - session.drawStart) / 1000));
    const el = app.querySelector('#draw-clock');
    if (el) el.textContent = left > 0 ? `還剩 ${left} 秒` : '時間到，可以按下一步了';
    if (left <= 0) {
      window.clearInterval(session.drawTimerId);
      session.drawTimerId = null;
      session.interactionDone.drawing = true;
      const ready = app.querySelector('[data-action="activity-ready"]');
      if (ready) ready.disabled = !guideComplete();
    }
  };
  session.drawTimerId = window.setInterval(tick, 1000);
  tick();
}

function stopWheel() {
  if (session.wheelStopped) return;
  const el = app.querySelector('#roulette-wheel');
  const m = new DOMMatrixReadOnly(getComputedStyle(el).transform);
  let angle = Math.round(Math.atan2(m.b, m.a) * 180 / Math.PI);
  if (angle < 0) angle += 360;
  const at = (360 - angle) % 360;
  const [key, text] = at >= 60 && at < 180 ? ['B', '這代表我下次知道怎麼做囉！'] : at >= 180 && at < 300 ? ['C', '沒關係，我已經盡力了！'] : ['A', '還好沒有更糟糕！'];
  session.wheelAngle = angle;
  session.wheelStopped = true;
  session.selectedReframe = `${key}：「${text}」`;
  session.interactionDone.wheel = true;
  session.interactionDone.reframe = true;
  render();
}

function startWaitClock() {
  const item = activities.find((a) => a.id === session.selectedActivity);
  if (!item || !item.waitSeconds || session.waitStart) return;
  session.waitStart = Date.now();
  const tick = () => {
    const left = Math.max(0, item.waitSeconds - Math.floor((Date.now() - session.waitStart) / 1000));
    const el = app.querySelector('#wait-clock');
    if (el) el.textContent = left > 0 ? `請先照著做，還剩 ${left} 秒才能按下一步` : '時間到，可以按下一步了';
    if (left <= 0) {
      window.clearInterval(session.waitTimerId);
      session.waitTimerId = null;
      session.waitDone = true;
      const ready = app.querySelector('[data-action="activity-ready"]');
      if (ready) ready.disabled = !guideComplete();
    }
  };
  session.waitTimerId = window.setInterval(tick, 1000);
  tick();
}

function leavePreview() {
  [session.activityTimerId, session.drawTimerId, session.waitTimerId].forEach((id) => { if (id) window.clearInterval(id); });
  session.activityTimerId = null; session.drawTimerId = null; session.waitTimerId = null;
  session.activityTimer = null;
  session.teacherPreview = false;
  session.toolboxMode = false;
  session.selectedActivity = null;
  teacherUI.view = 'tools';
  setStage('teacherDashboard');
}

/* 排行榜：只計算前後測完整、且後測沒有高於前測的紀錄 */
function rankFrom(attempts) {
  const stats = {};
  attempts.filter((a) => a.status === 'done' && typeof a.pre === 'number' && typeof a.post === 'number' && a.post <= a.pre).forEach((a) => {
    const t = stats[a.name] || (stats[a.name] = { name: a.name, n: 0, sum: 0 });
    t.n += 1;
    t.sum += a.pre - a.post;
  });
  return Object.values(stats).map((t) => ({ ...t, avg: t.sum / t.n })).sort((a, b) => b.avg - a.avg || b.n - a.n).slice(0, 5);
}

function personalRanking() {
  const profile = session.profile ? (readProfiles()[session.profile.id] || session.profile) : null;
  const rows = ((profile && profile.records) || []).flatMap((r) => r.attempts || []);
  if (!session.recordSaved) rows.push(...(session.attempts || []));
  return rankFrom(rows);
}

function kahootList(list) {
  const max = Math.max(0.1, ...list.map((t) => t.avg));
  return `<ol class="kahoot-list">${list.map((t, i) => `<li class="kahoot-row k${i % 4}" style="animation-delay:${i * 0.4}s"><span class="k-rank">${i === 0 ? '👑' : i + 1}</span><span><strong>${esc(t.name)}</strong><span class="k-bar"><i style="--w:${Math.max(8, Math.round((t.avg / max) * 100))}%;animation-delay:${i * 0.4 + 0.4}s"></i></span></span><span class="k-score">降低 <b data-count="${t.avg.toFixed(2)}" data-delay="${i * 400}">0.0</b> 級<small>${t.n} 次</small></span></li>`).join('')}</ol>`;
}

function animateCounts() {
  app.querySelectorAll('[data-count]').forEach((el) => {
    const target = Number(el.dataset.count);
    const t0 = performance.now() + Number(el.dataset.delay || 0);
    const step = (t) => {
      const p = Math.min(1, Math.max(0, (t - t0) / 900));
      el.textContent = (target * p).toFixed(1);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function flipCard(a) {
  const act = activities.find((x) => x.name === a.name);
  const icon = act ? (ASSET_ICONS[act.image] || '✦') : '✦';
  return `<button class="flip-card" type="button" data-action="flip" aria-label="翻開卡片"><span class="flip-inner"><span class="flip-face flip-front">?<small>點我翻牌</small></span><span class="flip-face flip-back"><b>${icon}</b><strong>${esc(a.name)}</strong><small>感覺降低了 ${a.pre - a.post} 級</small></span></span></button>`;
}

function collectStudents() {
  const map = new Map();
  if (!apiEnabled()) Object.values(readProfiles()).forEach((p) => map.set(p.id, { group: p.group, seat: p.seat, records: [...(p.records || [])] }));
  teacherData.records.forEach((p) => {
    const entry = map.get(p.id) || { group: p.group, seat: p.seat, records: [] };
    const seen = new Set(entry.records.map((r) => r.at));
    (p.records || []).forEach((r) => { if (!seen.has(r.at)) entry.records.push(r); });
    map.set(p.id, entry);
  });
  return [...map.entries()].map(([id, st]) => {
    const records = st.records.sort((a, b) => a.at - b.at);
    const latest = records[records.length - 1];
    const negative = latest && NEGATIVE_ROCKETS.includes(latest.state);
    const urgency = negative && latest.final >= 4 ? 3 : negative && latest.final === 3 ? 2 : 1;
    return { id, group: st.group, seat: st.seat, records, latest, urgency, helpTotal: records.reduce((n, r) => n + (r.helpCount || 0), 0) };
  }).filter((st) => st.records.length);
}

function filterStudents(list) {
  const f = teacherUI.filter;
  const day = new Date();
  day.setHours(0, 0, 0, 0);
  return list.filter((st) => (!f.group || st.group === f.group)
    && (!f.urgency || String(st.urgency) === f.urgency)
    && (!f.help || st.helpTotal >= Number(f.help))
    && (!f.time || st.latest.at >= (f.time === 'today' ? day.getTime() : Date.now() - 7 * 86400000)))
    .sort((a, b) => b.urgency - a.urgency || b.latest.at - a.latest.at);
}

async function exportExcel() {
  const list = filterStudents(collectStudents());
  const rows = [['班級', '座號', '時間', '火箭類型', '情緒', '調適方法與前後測', '求助次數']];
  list.forEach((st) => st.records.forEach((r) => rows.push([st.group, st.seat, new Date(r.at).toLocaleString('zh-TW'), r.state, r.emotion, (r.attempts || []).map((a) => `${a.name}：${attemptText(a)}`).join('；'), r.helpCount || 0])));
  try {
    if (!window.XLSX) throw new Error('xlsx not loaded');
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '使用紀錄');
    XLSX.writeFile(wb, '情緒導航員紀錄.xlsx');
    teacherUI.notice = '';
  } catch {
    const csv = '\ufeff' + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = '情緒導航員紀錄.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    teacherUI.notice = '無法產生 xlsx，已改存成 CSV（Excel 可直接開啟）。';
  }
  render();
}

function attemptText(a) {
  return a.status === 'done' ? `${a.pre} 級 → ${a.post} 級` : a.status === 'nopost' || a.status === 'pending' ? '未填後測' : '尚未完成';
}

function commitRecord() {
  if (!session.profile || !session.state || session.recordSaved) return;
  session.recordSaved = true;
  if (!session.toolboxMode && ['activityGuide', 'activityCheck'].includes(session.stage) && session.selectedActivity) {
    const a = activities.find((x) => x.id === session.selectedActivity);
    session.attempts.push({ name: a.name, level: a.level, pre: session.preActivityRating, post: null, status: 'unfinished' });
  }
  session.attempts.forEach((a) => { if (a.status === 'pending') a.status = 'nopost'; });
  const profiles = readProfiles();
  const profile = profiles[session.profile.id] || session.profile;
  const record = { at: Date.now(), state: states[session.state].label, emotion: session.emotion, initial: session.initialRating, final: session.rating, attempts: session.attempts, helpCount: session.helpCount || 0 };
  profile.records = [...(profile.records || []), record];
  outboxWrite([...outboxRead(), { id: profile.id, record, badges: profile.badges || {} }]);
  profiles[profile.id] = profile;
  saveProfiles(profiles);
  session.profile = profile;
  flushOutbox().then(() => syncProfile(profile)).then((ok) => {
    if (!ok) return;
    const ps = readProfiles();
    ps[profile.id] = profile;
    saveProfiles(ps);
  });
}

function logout() {
  commitRecord();
  stopSessionTimer();
  if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
  session.activityTimerId = null;
  session.profile = null;
  session.expired = false;
  session.toolboxMode = false;
  setStage('profile');
}

function openToolbox() {
  if (session.expired) return;
  if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
  session.activityTimerId = null;
  if (!session.toolboxMode) session.savedFlow = { stage: session.stage, selectedActivity: session.selectedActivity };
  session.toolboxMode = true;
  setStage('toolbox');
}

function closeToolbox() {
  if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
  session.activityTimerId = null;
  session.activityTimer = null;
  session.toolboxMode = false;
  const flow = session.savedFlow || { stage: 'state', selectedActivity: null };
  session.selectedActivity = flow.selectedActivity;
  setStage(flow.stage);
}

function finishSession() {
  if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
  session.activityTimerId = null;
  session.stage = 'done';
  commitRecord();
  render();
  if (session.needsTeacher) simulateTeacherCall();
}

function restart() {
  if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
  session.activityTimerId = null;
  if (session.expired) { logout(); return; }
  session.profile ? beginSession() : setStage('profile');
}

app.addEventListener('submit', (event) => {
  if (event.target.id === 'profile-form') {
    event.preventDefault();
    setProfileFromForm();
  } else if (event.target.id === 'teacher-login-form') {
    event.preventDefault();
    const data = new FormData(event.target);
    teacherLogin(String(data.get('teacher-account')), String(data.get('teacher-password')));
  }
});

app.addEventListener('click', (event) => {
  if (!session.expired && !session.wheelStopped && session.stage === 'activityGuide' && event.target.closest('#roulette-wheel')) { stopWheel(); return; }
  const button = event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const { action, value } = button.dataset;
  if (session.expired && !['logout', 'help'].includes(action)) return;
  if (action === 'state') { session.state = value; setStage('emotion'); }
  else if (action === 'emotion') { session.emotion = value; session.rating = 3; setStage('rating'); }
  else if (action === 'begin-session') tryBegin();
  else if (action === 'continue-rating') {
    session.initialRating = session.rating;
    session.preActivityRating = session.initialRating;
    session.rating = session.initialRating;
    session.activityLevelOverride = null;
    session.recommendedActivityId = null;
    session.retrySameLevel = false;
    if (states[session.state].route === 'positive') setStage('strengths');
    else if (recordNegativeRating(session.rating)) return;
    else if (session.rating === 5) {
      session.highIntensityCycle = true;
      session.highLevelStep = 1;
      session.escalated = true;
      session.adultPresent = true;
      setStage('activityList');
    } else setStage('activityList');
  } else if (action === 'finish-positive') {
    earnSelectedStickers();
    commitRecord();
    setStage('done');
  } else if (action === 'strength') {
    const index = Number(value);
    session.selectedStrengths = session.selectedStrengths.includes(index)
      ? session.selectedStrengths.filter((item) => item !== index)
      : session.selectedStrengths.length < 2 ? [...session.selectedStrengths, index] : session.selectedStrengths;
    render();
  } else if (action === 'choose-activity') {
    if (session.stage === 'teacherDashboard') { session.teacherPreview = true; session.toolboxMode = true; }
    if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
    session.activityTimerId = null;
    session.selectedActivity = value;
    session.activeMethodLevel = activities.find((item) => item.id === value).level;
    session.checkedSteps = [];
    session.interactionDone = {};
    session.selectedReframe = null;
    session.wheelRotation = 0;
    session.wheelSpinning = false;
    session.wheelStopped = false;
    session.wheelAngle = 0;
    if (session.waitTimerId) window.clearInterval(session.waitTimerId);
    session.waitTimerId = null;
    session.waitStart = null;
    session.waitDone = false;
    if (session.drawTimerId) window.clearInterval(session.drawTimerId);
    session.drawTimerId = null;
    session.drawStart = null;
    if (!session.toolboxMode) session.preActivityRating = session.rating;
    session.activityTimer = null;
    const selected = activities.find((item) => item.id === value);
    if (selected.breathing || selected.timedActivity) session.activityTimer = { phase: 'ready', cycle: 0, seconds: 0, phaseLabel: '' };
    setStage('activityGuide');
  } else if (action === 'activity-ready') { if (session.teacherPreview) leavePreview(); else setStage(session.toolboxMode ? 'toolbox' : 'activityCheck'); }
  else if (action === 'start-activity-timer') startActivityTimer();
  else if (action === 'stop-activity-timer') stopActivityTimer();
  else if (action === 'spin-wheel') spinReframeWheel();
  else if (action === 'clear-drawing') {
    const canvas = app.querySelector('#doodle-canvas');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  } else if (action === 'report-done' || action === 'report-not-done') {
    const done = action === 'report-done';
    if (!done) {
      session.checkedSteps = [];
      session.interactionDone = {};
      session.selectedReframe = null;
      session.wheelStopped = false;
      if (session.drawTimerId) window.clearInterval(session.drawTimerId);
      session.drawTimerId = null;
      session.drawStart = null;
      const unfinished = activities.find((item) => item.id === session.selectedActivity);
      session.activityTimer = unfinished?.breathing || unfinished?.timedActivity
        ? { phase: 'ready', cycle: 0, seconds: 0, phaseLabel: '' }
        : null;
      setStage('activityGuide');
      return;
    }
    if (!session.triedActivities.includes(session.selectedActivity)) session.triedActivities.push(session.selectedActivity);
    session.completedActivities.push(session.selectedActivity);
    session.activeMethodLevel = activities.find((item) => item.id === session.selectedActivity).level;
    const doneMethod = activities.find((item) => item.id === session.selectedActivity);
    session.attempts.push({ name: doneMethod.name, level: doneMethod.level, pre: session.preActivityRating, post: null, status: 'pending' });
    session.lastActivityId = session.selectedActivity;
    session.selectedActivity = null;
    session.recommendedActivityId = null;
    if (session.highIntensityCycle && session.highLevelStep < 3) {
      /* 前測 5 級：第 1、2、3 級都做完才能後測 */
      session.highLevelStep += 1;
      setStage('activityList');
    } else {
      session.rating = session.preActivityRating;
      setStage('review');
    }
  } else if (action === 'submit-review') {
    const pending = session.attempts.filter((a) => a.status === 'pending');
    const pre = pending.length ? pending[0].pre : session.preActivityRating;
    const post = session.rating;
    pending.forEach((a) => { a.post = post; a.status = 'done'; });
    const lastLevel = activities.find((item) => item.id === session.lastActivityId).level;
    if (recordNegativeRating(post)) return;
    const bothLowest = pre === 1 && post === 1;
    if (bothLowest || (post < pre && !(session.escalated && post >= 4))) { finishSession(); return; }
    session.recommendedActivityId = null;
    if (post === 5 && !session.escalated) {
      session.highIntensityCycle = true;
      session.escalated = true;
      session.adultPresent = true;
      session.highLevelStep = 1;
    } else {
      session.highIntensityCycle = false;
      const next = nextActivityLevel(lastLevel);
      if (!next) { session.needsTeacher = post >= 4; finishSession(); return; }
      session.activityLevelOverride = next;
    }
    setStage('activityList');
  } else if (action === 'adult-present') {
    session.adultPresent = true;
    session.highLevelStep = 1;
    setStage('activityList');
  } else if (action === 'continue-with-adult') {
    if (session.highIntensityCycle) {
      session.highLevelStep = 1;
      session.highCycleStartRating = session.rating;
    } else {
      session.activityLevelOverride = session.activeMethodLevel;
      session.retrySameLevel = true;
      session.recommendedActivityId = null;
    }
    setStage(availableActivities().length ? 'activityList' : 'done');
  } else if (action === 'close-after-support' || action === 'finish-without-activity') finishSession();
  else if (action === 'activity-list') {
    if (session.activityTimerId !== null) window.clearInterval(session.activityTimerId);
    session.activityTimerId = null;
    session.activityTimer = null;
    session.selectedActivity = null;
    setStage('activityList');
  } else if (action === 'review-after-exhaustion') {
    session.rating = session.preActivityRating ?? session.initialRating;
    setStage('review');
  } else if (action === 'reroll-method') {
    recommendAnotherActivity();
  } else if (action === 'back') setStage(session.stage === 'emotion' ? 'state' : session.stage === 'rating' ? 'emotion' : 'rating');
  else if (action === 'flip') button.classList.toggle('flipped');
  else if (action === 'teacher-tab') { if (session.teacherPreview) leavePreview(); teacherUI.view = value; setStage('teacherDashboard'); }
  else if (action === 'teacher-student') { teacherUI.view = 'student'; teacherUI.studentId = value; setStage('teacherDashboard'); }
  else if (action === 'teacher-export') exportExcel();
  else if (action === 'logout') logout();
  else if (action === 'open-toolbox') openToolbox();
  else if (action === 'close-toolbox') closeToolbox();
  else if (action === 'help') simulateTeacherCall();
  else if (action === 'restart') restart();
  else if (action === 'profile') {
    stopSessionTimer(false);
    session.profile = null;
    setStage('profile');
  } else if (action === 'teacher-login') setStage('teacherGate');
  else if (action === 'back-to-profile') { unwatchTeacherData(); setStage('profile'); }
  else if (action === 'stickers') setStage('stickerCollection');
  else if (action === 'back-to-state') setStage('state');
});

app.addEventListener('change', (event) => {
  if (event.target.matches('[data-filter]')) { teacherUI.filter[event.target.dataset.filter] = event.target.value; setStage('teacherDashboard'); return; }
  if (event.target.matches('[data-action="check-step"]')) {
    const index = Number(event.target.dataset.value);
    session.checkedSteps = event.target.checked
      ? [...new Set([...session.checkedSteps, index])]
      : session.checkedSteps.filter((item) => item !== index);
    const ready = app.querySelector('[data-action="activity-ready"]');
    if (ready) ready.disabled = !guideComplete();
    updateActivityTimerPanel();
  }
  if (event.target.matches('[data-action="adult-confirm"]')) {
    session.adultPresent = event.target.checked;
    const next = app.querySelector('[data-action="adult-present"], [data-action="continue-with-adult"], [data-action="finish-without-activity"]');
    if (next) next.disabled = !event.target.checked;
  }
});

app.addEventListener('input', (event) => {
  if (event.target.id !== 'rating-range') return;
  session.rating = Number(event.target.value);
  document.querySelector('#rating-output').value = session.rating;
  document.querySelector('#rating-output').textContent = session.rating;
});

document.querySelector('.help-button').addEventListener('click', () => { session.helpCount = (session.helpCount || 0) + 1; simulateTeacherCall(); });
document.querySelector('#help-done').addEventListener('click', () => helpDialog.close());
document.querySelector('#stickers-button').addEventListener('click', () => setStage('stickerCollection'));
document.querySelector('#toolbox-button').addEventListener('click', openToolbox);
document.querySelector('#teacher-logout').addEventListener('click', () => {
  unwatchTeacherData();
  if (session.teacherPreview) leavePreview();
  session.profile = null;
  session.expired = false;
  setStage('profile');
});
document.querySelector('#profile-button').addEventListener('click', logout);
window.addEventListener('resize', updateProfileButtonLabel);
document.querySelector('.brand').addEventListener('click', (event) => { event.preventDefault(); restart(); });

render();
flushOutbox();
    </script>
  </body>
</html>
